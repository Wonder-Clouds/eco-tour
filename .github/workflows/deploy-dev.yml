name: Deploy Development (Dev)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-dev"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd "$HOME/$TARGET_DIR"
            
            echo "🚀 Sincronizando código de DEV..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "$ENV_DATA" > .env
            
            echo "🧹 Limpiando recursos..."
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true
            podman builder prune -f

            podman-compose stop backend frontend || true

            echo "⚙️ Reconstruyendo Backend..."
            podman build -t ${PROJECT_NAME}_backend:latest ./backend
            
            echo "🔧 Aplicando parche de dependencias en package.json..."
            # Inyectamos ohash directamente en la sección de dependencies
            # Esto garantiza que pnpm lo instale sin importar el Dockerfile
            sed -i '/"dependencies": {/a \    "ohash": "latest",' ./eco-tour-admin/package.json
            
            echo "⚙️ Reconstruyendo Frontend..."
            podman build -t ${PROJECT_NAME}_frontend:latest ./eco-tour-admin

            echo "🚀 Levantando servicios..."
            podman-compose up -d backend frontend
            echo "✅ Desarrollo actualizado correctamente"
        env:
          ENV_DATA: ${{ secrets.ENV_DEV }}