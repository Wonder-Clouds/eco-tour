name: Deploy Development (Dev)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-dev"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            
            # Navegar al directorio de desarrollo de forma segura
            cd "$HOME/$TARGET_DIR"
            
            echo "📍 Directorio actual: $(pwd)"
            echo "🚀 Iniciando despliegue en DEV..."
            
            # Sincronización total con la rama dev
            git fetch origin dev
            git reset --hard origin/dev

            # Generar archivo .env desde los Secrets de GitHub
            echo "$ENV_DATA" > .env
            echo "📝 Archivo .env de Desarrollo actualizado"

            # Limpiar imágenes antiguas
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true

            # Detener servicios antes de reconstruir
            podman-compose stop backend frontend || true

            # CONSTRUCCIÓN CON ULIMIT EXTENDIDO
            # Pasamos el argumento a través de podman-compose para evitar errores de argumentos no reconocidos
            echo "⚙️ Reconstruyendo imágenes con ulimit 65k..."
            podman-compose build --podman-build-args "--ulimit nofile=65536:65536" backend frontend

            # Levantar servicios en segundo plano
            echo "🚀 Levantando servicios actualizados..."
            podman-compose up -d backend frontend
            
            echo "✅ Desarrollo actualizado correctamente"
        env:
          ENV_DATA: ${{ secrets.ENV_DEV }}