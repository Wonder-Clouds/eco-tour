name: Deploy Development (Dev)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-dev"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd "$HOME/$TARGET_DIR"
            
            echo "🚀 Sincronizando código..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "$ENV_DATA" > .env
            
            echo "🧹 Limpiando imágenes obsoletas..."
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true

            podman-compose stop backend frontend || true

            echo "⚙️ Reconstruyendo Backend..."
            podman build -t ${PROJECT_NAME}_backend:latest ./backend
            
            echo "⚙️ Reconstruyendo Frontend con parche de dependencias..."
            # PARCHE: Inyectamos ohash directamente en el Dockerfile antes de construir
            # Esto soluciona el error de Nitro Nightly sin tocar tu repositorio local
            sed -i 's/pnpm install/pnpm add ohash \&\& pnpm install/g' ./eco-tour-admin/Dockerfile || true
            
            podman build -t ${PROJECT_NAME}_frontend:latest ./eco-tour-admin

            echo "🚀 Levantando servicios..."
            podman-compose up -d backend frontend
            echo "✅ Desarrollo actualizado"

        env:
          ENV_DATA: ${{ secrets.ENV_DEV }}