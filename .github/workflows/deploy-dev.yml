name: Deploy Development (Dev)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-dev"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Development)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd "$HOME/$TARGET_DIR"
            
            echo "🚀 Actualizando código de DEV..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "$ENV_DATA" > .env
            
            echo "🧹 Limpiando imágenes antiguas..."
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true

            echo "🛑 Deteniendo contenedores..."
            podman-compose stop backend frontend || true

            # USAMOS PODMAN DIRECTAMENTE PARA EL BUILD
            # Esto evita las limitaciones de podman-compose y acepta el ulimit
            echo "⚙️ Reconstruyendo imágenes con Podman directo (ulimit 65k)..."
            
            # Build Backend
            podman build --ulimit nofile=65536:65536 -t ${PROJECT_NAME}_backend:latest ./backend
            
            # Build Frontend
            podman build --ulimit nofile=65536:65536 -t ${PROJECT_NAME}_frontend:latest ./frontend

            echo "🚀 Levantando servicios..."
            # Usamos up para que podman-compose use las imágenes recién creadas
            podman-compose up -d backend frontend
            
            echo "✅ Desarrollo actualizado correctamente"
        env:
          ENV_DATA: ${{ secrets.ENV_DEV }}