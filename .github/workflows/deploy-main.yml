name: Deploy Production (Main)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-main"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd "$HOME/$TARGET_DIR"
            
            echo "🚀 Sincronizando código de Producción..."
            git fetch origin main
            git reset --hard origin/main

            echo "$ENV_DATA" > .env
            
            echo "🧹 Limpiando imágenes y caché de construcción..."
            # Eliminamos imágenes viejas
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true
            # Forzamos limpieza de caché para evitar errores de dependencias fantasmas
            podman builder prune -f

            podman-compose stop backend frontend || true

            echo "⚙️ Reconstruyendo Backend..."
            podman build -t ${PROJECT_NAME}_backend:latest ./backend
            
            echo "⚙️ Reconstruyendo Frontend con parche Nitro (ohash)..."
            # Este comando inyecta ohash en el proceso de instalación del Dockerfile
            # Soluciona el error de Rollup sin modificar tu código fuente
            sed -i 's/pnpm install/pnpm add ohash \&\& pnpm install/g' ./eco-tour-admin/Dockerfile || true
            
            podman build -t ${PROJECT_NAME}_frontend:latest ./eco-tour-admin

            echo "🚀 Levantando servicios en Producción..."
            podman-compose up -d backend frontend
            
            echo "✅ Producción actualizada correctamente"
        env:
          ENV_DATA: ${{ secrets.ENV_MAIN }}