name: Deploy Production (Main)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "eco-tour-main"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd "$HOME/$TARGET_DIR"
            
            echo "🚀 Actualizando código de PROD..."
            git fetch origin main
            git reset --hard origin/main

            echo "$ENV_DATA" > .env
            
            echo "🧹 Limpiando imágenes antiguas..."
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true

            echo "🛑 Deteniendo contenedores de producción..."
            podman-compose stop backend frontend || true

            echo "⚙️ Reconstruyendo imágenes con Podman directo (ulimit 65k)..."
            
            # Construcción del Backend
            podman build --ulimit nofile=65536:65536 -t ${PROJECT_NAME}_backend:latest ./backend
            
            # Construcción del Frontend (Ajustar nombre de carpeta si es necesario)
            # Usamos eco-tour-admin basándonos en tu estructura de archivos
            podman build --ulimit nofile=65536:65536 -t ${PROJECT_NAME}_frontend:latest ./eco-tour-admin

            echo "🚀 Levantando servicios en producción..."
            podman-compose up -d backend frontend
            
            echo "✅ Producción actualizada correctamente"
        env:
          ENV_DATA: ${{ secrets.ENV_MAIN }}