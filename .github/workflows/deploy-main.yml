name: Deploy Main

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert to lower case
        id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build y push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/backend:main
            ghcr.io/${{ steps.repo.outputs.repo }}/backend:latest
          cache-from: type=gha,scope=backend-main
          cache-to: type=gha,mode=max,scope=backend-main

      - name: Build y push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./eco-tour-admin
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/frontend:main
            ghcr.io/${{ steps.repo.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend-main
          cache-to: type=gha,mode=max,scope=frontend-main

      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: bash ~/scripts/deploy.sh main