name: Deploy Production (Main)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_DIR: "~/eco-tour-main"
      PROJECT_NAME: "eco-tour"

    steps:
      - name: Deploy to VPS (Production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: TARGET_DIR, PROJECT_NAME, ENV_DATA
          script: |
            set -e
            cd ${TARGET_DIR}
            echo "📍 Directorio actual: $(pwd)"
            echo "🚀 Desplegando PROD desde rama main..."
            
            git fetch origin main
            git reset --hard origin/main

            # Crear el archivo .env desde el secreto
            echo "$ENV_DATA" > .env

            # Limpiar imágenes viejas
            podman images --format "{{.Repository}} {{.ID}}" | grep ${PROJECT_NAME} | tail -n +2 | awk '{print $2}' | xargs -r podman rmi -f || true

            podman-compose stop backend frontend || true
            podman-compose build backend frontend
            podman-compose up -d backend frontend
            echo "✅ Producción actualizada"
        env:
          ENV_DATA: ${{ secrets.ENV_MAIN }}