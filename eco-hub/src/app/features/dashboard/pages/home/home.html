<div>
  <div>
    <h1 class="text-3xl font-semibold">Bienvenido a Eco-Hub</h1>
    <div class="flex flex-row w-full mt-6 mb-10 gap-4">
      <div class="w-full border border-black rounded-lg p-4 cards">
        <h4>Total de servicios</h4>
      </div>
      <div class="w-full border border-black rounded-lg p-4 cards">
        <h4>Total de grupos</h4>
      </div>
      <div class="w-full border border-black rounded-lg p-4 cards">
        <h4>Total de reservas</h4>
      </div>
    </div>

    <div class="flex flex-row gap-10">
      <div class="w-2/3">
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'bar'"
        >
        </canvas>
      </div>
      <div class="w-1/3">
        <canvas
          baseChart
          [data]="pieChartData"
          [type]="pieChartType"
          [options]="pieChartOptions"
        >
        </canvas>
      </div>
    </div>
  </div>
</div>
