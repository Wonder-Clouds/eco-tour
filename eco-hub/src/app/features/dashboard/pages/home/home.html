<div>
  <div>
    <h1 class="text-3xl font-semibold">Bienvenido a Eco-Hub</h1>
    <div class="flex flex-row w-full mt-6 mb-10 gap-4">
      <div class="w-full border border-black rounded-lg p-4">
        <h4>Total de servicios</h4>
      </div>
      <div class="w-full border border-black rounded-lg p-4">
        <h4>Total de grupos</h4>
      </div>
      <div class="w-full border border-black rounded-lg p-4">
        <h4>Total de reservas</h4>
      </div>
    </div>

    <div class="flex flex-row">
      <canvas
        baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="'bar'"
      >
      </canvas>
    </div>
  </div>
</div>
