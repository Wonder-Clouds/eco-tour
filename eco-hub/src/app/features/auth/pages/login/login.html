<div class="login">
  <div class="login-container">
    <img
      src="images/ecotourcuscologo.svg"
      alt="Logo EcoHub"
      class="login-logo"
    />
    <span class="login-subtitle">Entrar al sistema</span>

    <form class="login-form">
      <mat-form-field appearance="outline" class="login-field">
        <mat-label>Usuario</mat-label>
        <input matInput />
      </mat-form-field>

      <mat-form-field appearance="outline" class="login-field">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" />
        <button
          mat-icon-button
          matSuffix
          (click)="clickEvent($event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()"
        >
          <mat-icon>{{ hide() ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>

      <button class="primary-button" (click)="login()">Entrar</button>
    </form>
  </div>

  <div class="login-image-container">
    <img
      src="https://www.condorxtreme.com/wp-content/uploads/2024/07/Tour-Machupicchu-1-Dia-Desde-Cusco-2.jpg"
      alt="Login Image"
    />
  </div>
</div>
