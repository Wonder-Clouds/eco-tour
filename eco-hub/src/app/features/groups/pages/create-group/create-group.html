<div class="flex flex-col gap-2">
  <h1 class="text-xl">Crear Grupo</h1>

  <div class="flex flex-row gap-10">
    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Nombre del grupo</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Descripción</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="number" formControlName="description" required />
      <label>Cantidad de personas</label>
      <span class="focus-bg"></span>
    </div>
  </div>

  <h1 class="text-xl">Crear Personas</h1>

  <div class="flex flex-row gap-3">
    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Nombres</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Apellidos</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Email</label>
      <span class="focus-bg"></span>
    </div>
  </div>

  <div class="flex flex-row gap-3">
    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Numero de pasaporte</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Numero de celular</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Nacionalidad</label>
      <span class="focus-bg"></span>
    </div>

    <div class="input-wrapper">
      <input type="text" formControlName="description" required />
      <label>Fecha de nacimiento</label>
      <span class="focus-bg"></span>
    </div>
  </div>
</div>
