<div class="service-create-container">
  <app-header [title]="'Crear Servicio'"></app-header>
  <mat-progress-bar
    mode="determinate"
    [value]="progressValue"
  ></mat-progress-bar>

  @if (currentStep === 1) {
  <form [formGroup]="serviceForm" class="service-form">
    <!-- <app-file-upload
      accept="image/*"
      [multiple]="true"
      (filesSelected)="onFilesSelected($event)"
    >
    </app-file-upload> -->
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">info</mat-icon>
        <mat-card-title>Información General</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="input-wrapper">
          <input type="text" formControlName="title" required />
          <label>Título</label>
          <span class="focus-bg"></span>
        </div>
        <div class="row">
          <mat-form-field class="full-width">
            <mat-label>Tipo de Servicio</mat-label>
            <mat-select formControlName="type">
              @for (type of serviceTypes; track type) {
              <mat-option [value]="type.value">
                {{ type.viewValue }}
              </mat-option>
              }
            </mat-select>
            <mat-icon matPrefix>category</mat-icon>
          </mat-form-field>

          <div class="input-wrapper">
            <input type="text" formControlName="duration" required />
            <label>Duración</label>
            <span class="focus-bg"></span>
          </div>
        </div>

        <div class="input-wrapper">
          <textarea type="text" formControlName="summary" required></textarea>
          <label>Descripción</label>
          <span class="focus-bg"></span>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Paso 5: Inclusiones -->
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">checklist</mat-icon>
        <mat-card-title>Inclusiones y Exclusiones</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="row">
          <div class="input-wrapper">
            <textarea
              type="text"
              formControlName="includes"
              required
            ></textarea>
            <label>Incluye</label>
            <span class="focus-bg"></span>
          </div>

          <div class="input-wrapper">
            <textarea
              type="text"
              formControlName="excludes"
              required
            ></textarea>
            <label>No Incluye</label>
            <span class="focus-bg"></span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button mat-stroked-button type="button" class="btn-cancel">
        <mat-icon>close</mat-icon>
        Cancelar
      </button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        (click)="onSaveService()"
        class="btn-save"
      >
        <mat-icon>save</mat-icon>
        Continuar
      </button>
    </div>
  </form>
  } @if (currentStep === 2) {
  <form [formGroup]="itineraryForm">
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">map</mat-icon>
        <mat-card-title>Itinerario</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div formArrayName="items">
          @for (item of items.controls; let i = $index; track i) {

          <div [formGroupName]="i" class="itinerary-block">
            <div class="input-wrapper">
              <input type="text" formControlName="title" required />
              <label>Título</label>
              <span class="focus-bg"></span>
            </div>

            <div class="input-wrapper">
              <textarea formControlName="description" required></textarea>
              <label>Descripción</label>
              <span class="focus-bg"></span>
            </div>

            <button
              mat-stroked-button
              color="warn"
              type="button"
              (click)="removeItineraryItem(i)"
              class="secondary-button"
            >
              <mat-icon>delete</mat-icon>
              Eliminar
            </button>
          </div>
          }

          <button
            mat-raised-button
            color="primary"
            type="button"
            (click)="addItineraryItem()"
            class="primary-button"
          >
            <mat-icon>add</mat-icon>
            Añadir otro itinerario
          </button>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">photo_library</mat-icon>
        <mat-card-title>Galería de Imágenes</mat-card-title>
      </mat-card-header>
    </mat-card> -->

    <div class="form-actions">
      <button mat-stroked-button type="button" class="btn-cancel">
        <mat-icon>close</mat-icon>
        Cancelar
      </button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        (click)="onSaveItinerary(serviceId!)"
        class="btn-save"
      >
        <mat-icon>save</mat-icon>
        Guardar
      </button>
    </div>
  </form>
  }
</div>
