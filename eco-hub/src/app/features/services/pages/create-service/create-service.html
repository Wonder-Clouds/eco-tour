<div class="service-create-container">
  <app-header [title]="'Crear Servicio'"></app-header>
  <mat-progress-bar mode="determinate" value="40"></mat-progress-bar>

  @if(loading) {
  <div class="loading-container">
    <p>Cargando...</p>
  </div>
  } @else {
  <form [formGroup]="serviceForm" class="service-form">
    <!-- <app-file-upload
      accept="image/*"
      [multiple]="true"
      (filesSelected)="onFilesSelected($event)"
    >
    </app-file-upload> -->
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">info</mat-icon>
        <mat-card-title>Información General</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="input-wrapper">
          <input type="text" formControlName="title" required />
          <label>Título</label>
          <span class="focus-bg"></span>
        </div>
        <div class="row">
          <mat-form-field class="full-width">
            <mat-label>Tipo de Servicio</mat-label>
            <mat-select formControlName="serviceType">
              @for (type of serviceTypes; track type) {
              <mat-option [value]="type.value">
                {{ type.viewValue }}
              </mat-option>
              }
            </mat-select>
            <mat-icon matPrefix>category</mat-icon>
          </mat-form-field>

          <div class="input-wrapper">
            <input type="text" formControlName="duration" required />
            <label>Duración</label>
            <span class="focus-bg"></span>
          </div>
        </div>

        <div class="input-wrapper">
          <textarea type="text" formControlName="summary" required></textarea>
          <label>Descripción</label>
          <span class="focus-bg"></span>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Paso 3: Itinerario -->
    <!-- <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">map</mat-icon>
        <mat-card-title>Itinerario</mat-card-title>
      </mat-card-header>
      <mat-card-content [formGroup]="itineraryForm">
        <div class="input-wrapper">
          <input type="text" formControlName="title" required />
          <label>Título</label>
          <span class="focus-bg"></span>
        </div>

        <div class="input-wrapper">
          <textarea
            type="text"
            formControlName="description"
            required
          ></textarea>
          <label>Descripción</label>
          <span class="focus-bg"></span>
        </div>
      </mat-card-content>
    </mat-card> -->

    <!-- Paso 4: Multimedia -->
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">photo_library</mat-icon>
        <mat-card-title>Galería de Imágenes</mat-card-title>
      </mat-card-header>
    </mat-card>

    <!-- Paso 5: Inclusiones -->
    <mat-card class="form-section">
      <mat-card-header>
        <mat-icon class="section-icon">checklist</mat-icon>
        <mat-card-title>Inclusiones y Exclusiones</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="row">
          <div class="input-wrapper">
            <textarea
              type="text"
              formControlName="includes"
              required
            ></textarea>
            <label>Incluye</label>
            <span class="focus-bg"></span>
          </div>

          <div class="input-wrapper">
            <textarea
              type="text"
              formControlName="excludes"
              required
            ></textarea>
            <label>No Incluye</label>
            <span class="focus-bg"></span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Botones de Acción -->
    <div class="form-actions">
      <button mat-stroked-button type="button" class="btn-cancel">
        <mat-icon>close</mat-icon>
        Cancelar
      </button>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        (click)="onSaveService()"
        class="btn-save"
      >
        <mat-icon>save</mat-icon>
        Guardar Servicio
      </button>
    </div>
  </form>
  }
</div>
