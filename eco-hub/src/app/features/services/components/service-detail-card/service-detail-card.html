<div class="card">
  @if (imageUrl) {
  <img [src]="imageUrl" alt="Imagen del servicio" class="card-image" />
  }

  <div class="card-content">
    <h3 class="card-title">{{ title }}</h3>

    @if (subtitle) {
    <p class="card-subtitle">{{ subtitle }}</p>
    } @if (description) {
    <p class="card-description">{{ description }}</p>
    }
  </div>
</div>
