<div class="w-full h-full bg-white p-8">
  <form class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Crear Cotización</h1>

    <div class="flex flex-col md:flex-row gap-6 mb-4">
      <div class="flex-1">
        <label class="block text-gray-700 mb-2">Grupo</label>
        <select class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" required>
          <option value="">Selecciona grupo</option>
        </select>
      </div>
      <div class="flex-1">
        <label class="block text-gray-700 mb-2">Estado</label>
        <input type="text" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>
      <div class="flex-1">
        <label class="block text-gray-700 mb-2">Válido hasta</label>
        <input type="date" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-6 mb-4">
      <div class="flex-1">
        <label class="block text-gray-700 mb-2">Precio total</label>
        <input type="text" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>
      <div class="flex-1">
        <label class="block text-gray-700 mb-2">ID Cotización padre</label>
        <input type="text" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" required />
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 mb-2">Notas</label>
      <textarea class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500" rows="3" required></textarea>
    </div>

    <div class="flex gap-4">
      <button class="secondary-button border border-green-600 text-green-700 bg-white px-4 py-2 rounded-lg hover:bg-green-50" type="reset">Limpiar campos</button>
      <button class="primary-button bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700" type="submit">Guardar cotización</button>
    </div>
  </form>
</div>
