<app-header title="COTIZACIONES"></app-header>

<mat-form-field class="full-width">
  <mat-label>Tipo de Servicio</mat-label>
  <mat-select (selectionChange)="onGroupSelected($event.value)">
    @for (g of groups; track g) {
    <mat-option [value]="g.id">
      {{ g.name }}
    </mat-option>
    }
  </mat-select>
</mat-form-field>

@if (selectedGroup) {
<section class="activity-box">
  <h3>Actividades</h3>

  <div>
    <table mat-table [dataSource]="services" class="eco-table">
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let element; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let element">{{ element.title }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let element">{{ element.type }}</td>
      </ng-container>

      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Duración</th>
        <td mat-cell *matCellDef="let element">{{ element.duration }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let element">{{ element.price }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex flex-row gap-5">
            <button
              class="flex flex-row gap-2 bg-blue-500 text-white rounded-md p-2"
            >
              Elegir actividad
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      @if (loading) {
      <div>Cargando servicios...</div>
      }
    </table>
  </div>
</section>
}
