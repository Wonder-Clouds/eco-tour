<app-header
  title="COTIZACIONES"
  [onAddClick]="goToCreateQuote.bind(this)"
></app-header>

<section class="quotes-box">
  <div>
    <table mat-table [dataSource]="quotes" class="eco-table">
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <ng-container matColumnDef="version_display">
        <th mat-header-cell *matHeaderCellDef>Versión</th>
        <td mat-cell *matCellDef="let element">
          {{ element.version_display }}
        </td>
      </ng-container>

      <ng-container matColumnDef="notes">
        <th mat-header-cell *matHeaderCellDef>Notas</th>
        <td mat-cell *matCellDef="let element">{{ element.notes }}</td>
      </ng-container>

      <ng-container matColumnDef="total_price">
        <th mat-header-cell *matHeaderCellDef>Precio Total</th>
        <td mat-cell *matCellDef="let element">{{ element.total_price }}</td>
      </ng-container>

      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Creado</th>
        <td mat-cell *matCellDef="let element">
          {{ element.created_at | date : "short" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="group">
        <th mat-header-cell *matHeaderCellDef>Grupo</th>
        <td mat-cell *matCellDef="let element">
          {{ getGroupName(element.group) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let quote">
          <button
            (click)="goToQuoteDetail(quote.id)"
            matTooltip="Ver Cotización"
          >
            <span class="material-icons">visibility</span>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      @if (loading) {
      <div>Cargando cotizaciones...</div>
      }
    </table>
  </div>
</section>
