<div class="select-wrapper">
  <label>{{ label }}</label>

  <div class="select-box" (click)="isOpen = !isOpen" [class.active]="isOpen">
    <span [class.placeholder]="!selectedItem">
      {{ selectedItem ? getDisplayValue(selectedItem) : placeholder }}
    </span>
    <span class="arrow">▼</span>
  </div>

  @if (isOpen) {
  <div class="options">
    @for (item of items; track trackByFn($index, item)) {
    <div
      class="option"
      [class.selected]="isSelected(item)"
      (click)="selectItem(item)"
    >
      {{ getDisplayValue(item) }}
    </div>
    } @if (items.length === 0) {
    <div class="empty">No hay opciones disponibles</div>
    }
  </div>
  }
</div>

@if (isOpen) {
<div class="overlay" (click)="isOpen = false"></div>
}
