<!-- Botones de Acción -->
<div class="form-actions">
  <button
    mat-stroked-button
    type="button"
    class="btn-cancel"
    (click)="cancel.emit()"
  >
    <mat-icon>close</mat-icon>
    {{ cancelText }}
  </button>

  <button
    mat-raised-button
    color="primary"
    type="submit"
    class="btn-save"
    (click)="save.emit()"
  >
    <mat-icon>save</mat-icon>
    {{ saveText }}
  </button>
</div>
