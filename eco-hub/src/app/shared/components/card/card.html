<div class="card shadow-md rounded-lg overflow-hidden bg-white">
  @if (imageUrl) {
  <img [src]="imageUrl" alt="Card image" class="w-full h-40 object-cover" />
  }

  <div class="p-4">
    <h3 class="text-lg font-bold">{{ title }}</h3>
    @if (subtitle) {
    <p class="text-sm text-gray-500">{{ subtitle }}</p>
    } @if (imageUrl) {
    <img [src]="imageUrl" alt="Card image" class="w-full h-40 object-cover" />
    }
  </div>
</div>
