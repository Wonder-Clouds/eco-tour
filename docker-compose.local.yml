version: "3.9"

# Usado SOLO para probar en local con podman-compose.
# Buildea las imágenes directamente desde el código fuente.
# En el VPS se usa docker-compose.yml que descarga imágenes de GHCR.
#
# Uso:
#   podman-compose -f docker-compose.local.yml --env-file .env.dev up --build
#   podman-compose -f docker-compose.local.yml --env-file .env.main up --build

services:
  database:
    container_name: "database-${ENV}"
    hostname: database-${ENV}
    image: postgres:16-alpine
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresql_${ENV}:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    networks:
      - app-network

  backend:
    container_name: "backend-${ENV}"
    build: ./backend
    restart: always
    environment:
      ENV: ${ENV}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ENGINE: ${ENGINE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DEBUG: ${DEBUG}
      SIGNING_KEY: ${SIGNING_KEY}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    container_name: "frontend-${ENV}"
    build:
      context: ./eco-tour-admin
    restart: always
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - PORT=3000
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgresql_dev:
  postgresql_main:

networks:
  app-network:
    driver: bridge
